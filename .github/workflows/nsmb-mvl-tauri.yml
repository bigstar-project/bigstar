name: NSMB MvL Tauri

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release with Tauri updater metadata
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag to create when publishing manually; defaults to nsmb-mvl-gui-v<version>
        required: false
        type: string
  push:
    branches:
      - main
      - master
    tags:
      - "nsmb-mvl-gui-v*"
    paths:
      - ".github/workflows/nsmb-mvl-tauri.yml"
      - "scripts/prepare-nsmb-mvl-tauri-sidecars.ps1"
      - "tools/nsmb-mvl-gui/**"
      - "tools/nsmb-mvl-rom/**"
      - "tools/nsmb-net-bridge/**"
      - "src/**"
      - "CMakeLists.txt"
      - "vcpkg.json"
  pull_request:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/nsmb-mvl-tauri.yml"
      - "scripts/prepare-nsmb-mvl-tauri-sidecars.ps1"
      - "tools/nsmb-mvl-gui/**"
      - "tools/nsmb-mvl-rom/**"
      - "tools/nsmb-net-bridge/**"
      - "src/**"
      - "CMakeLists.txt"
      - "vcpkg.json"

permissions:
  contents: write

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions

jobs:
  gui-check:
    name: GUI check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install GUI dependencies
        working-directory: tools/nsmb-mvl-gui
        run: pnpm install --frozen-lockfile
      - name: Typecheck GUI
        working-directory: tools/nsmb-mvl-gui
        run: pnpm typecheck
      - name: Build frontend
        working-directory: tools/nsmb-mvl-gui
        run: pnpm vite:build
      - uses: dtolnay/rust-toolchain@stable
      - name: Check ROM generator
        run: cargo check --manifest-path tools/nsmb-mvl-rom/Cargo.toml

  melon-windows:
    name: melonDS Windows x86_64
    runs-on: windows-2025
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
      - uses: actions/checkout@v6
      - name: Restore cached melonDS exe
        id: melonds-exe-cache
        uses: actions/cache/restore@v4
        with:
          path: build/release-windows-x86_64/melonDS.exe
          key: melonds-exe-windows-x86_64-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'src/**', 'vcpkg.json') }}
      - uses: actions/cache/restore@v4
        if: steps.melonds-exe-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-x86_64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x86_64-windows-
      - uses: lukka/run-vcpkg@v11
        if: steps.melonds-exe-cache.outputs.cache-hit != 'true'
        with:
          vcpkgJsonGlob: vcpkg.json
      - uses: lukka/run-cmake@v10
        if: steps.melonds-exe-cache.outputs.cache-hit != 'true'
        with:
          configurePreset: release-windows-x86_64
          configurePresetAdditionalArgs: "['-DENABLE_DEBUG_DEPS=OFF', '-DMELONDS_EMBED_BUILD_INFO=ON']"
          buildPreset: release-windows-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: melonDS-windows-x86_64
          path: build/release-windows-x86_64/melonDS.exe
      - uses: actions/cache/save@v4
        if: always() && steps.melonds-exe-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-x86_64-windows-${{ hashFiles('vcpkg.json') }}
      - name: Save cached melonDS exe
        if: steps.melonds-exe-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/release-windows-x86_64/melonDS.exe
          key: melonds-exe-windows-x86_64-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'src/**', 'vcpkg.json') }}

  bridge-windows:
    name: bridge Windows x86_64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore bridge Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/nsmb-net-bridge -> target
          shared-key: nsmb-net-bridge-webrtc-windows
      - name: Build bridge
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\LLVM\bin",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin"
          )
          $libclangPath = $candidates | Where-Object { Test-Path (Join-Path $_ "libclang.dll") } | Select-Object -First 1
          if (-not $libclangPath) {
            throw "libclang.dll was not found"
          }
          $env:LIBCLANG_PATH = $libclangPath
          cargo build --release --features webrtc --manifest-path tools/nsmb-net-bridge/Cargo.toml
      - name: Run bridge signaling UDP pair smoke
        shell: pwsh
        run: .\tools\nsmb-net-bridge\target\release\nsmb-net-bridge.exe webrtc-signaling-udp-pair-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: nsmb-net-bridge-windows-x86_64
          path: tools/nsmb-net-bridge/target/release/nsmb-net-bridge.exe

  tauri-windows:
    name: Tauri Windows x86_64
    runs-on: windows-2025
    needs:
      - gui-check
      - melon-windows
      - bridge-windows
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Tauri Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/nsmb-mvl-gui/src-tauri -> target
          shared-key: nsmb-mvl-gui-tauri-windows
      - name: Restore Tauri bundler cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-bundlers-${{ runner.os }}
      - name: Enable pnpm
        run: corepack enable pnpm
      - uses: actions/download-artifact@v7
        with:
          name: melonDS-windows-x86_64
          path: build/release-windows-x86_64
      - uses: actions/download-artifact@v7
        with:
          name: nsmb-net-bridge-windows-x86_64
          path: tools/nsmb-net-bridge/target/release
      - name: Prepare sidecars
        shell: pwsh
        run: .\scripts\prepare-nsmb-mvl-tauri-sidecars.ps1
      - name: Install GUI dependencies
        working-directory: tools/nsmb-mvl-gui
        run: pnpm install --frozen-lockfile
      - name: Test Tauri backend
        run: cargo test --release --manifest-path tools/nsmb-mvl-gui/src-tauri/Cargo.toml
      - name: Resolve release metadata
        id: release-meta
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath "tools/nsmb-mvl-gui/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $publish = "${{ github.ref_type }}" -eq "tag"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.publish_release }}" -eq "true") {
            $publish = $true
          }

          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $inputTag = "${{ inputs.release_tag }}"
            if ($inputTag) {
              $tag = $inputTag
            } else {
              $tag = "nsmb-mvl-gui-v$($config.version)"
            }
          }

          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($config.version)" >> $env:GITHUB_OUTPUT
      - name: Build Tauri app
        working-directory: tools/nsmb-mvl-gui
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ("${{ steps.release-meta.outputs.publish }}" -eq "true") {
            if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
              throw "TAURI_SIGNING_PRIVATE_KEY secret is required to publish a signed updater release"
            }
            if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
              $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
            }
            pnpm tauri build --ci --config src-tauri/tauri.release.conf.json
          } else {
            pnpm tauri build
          }
      - name: Run packaged app preflight
        shell: pwsh
        run: .\tools\nsmb-mvl-gui\src-tauri\target\release\nsmb-mvl-gui.exe --preflight
      - name: Generate updater metadata
        if: steps.release-meta.outputs.publish == 'true'
        shell: pwsh
        run: |
          $bundleDir = "tools/nsmb-mvl-gui/src-tauri/target/release/bundle"
          $assetDir = "tools/nsmb-mvl-gui/release-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          Get-ChildItem -LiteralPath $bundleDir -Recurse -File |
            Where-Object { $_.Extension -ne ".sig" } |
            Copy-Item -Destination $assetDir -Force

          $pairs = Get-ChildItem -LiteralPath $bundleDir -Recurse -File -Filter "*.sig" | ForEach-Object {
            $artifactPath = $_.FullName -replace "\.sig$", ""
            if (Test-Path -LiteralPath $artifactPath) {
              [pscustomobject]@{
                ArtifactPath = $artifactPath
                ArtifactName = [IO.Path]::GetFileName($artifactPath)
                SignaturePath = $_.FullName
                Priority = if ($artifactPath -like "*.exe") { 0 } elseif ($artifactPath -like "*.msi") { 1 } else { 2 }
              }
            }
          }
          $pair = $pairs | Sort-Object Priority, ArtifactName | Select-Object -First 1
          if (-not $pair) {
            throw "No signed updater artifact pair was found under $bundleDir"
          }

          Copy-Item -LiteralPath $pair.SignaturePath -Destination $assetDir -Force
          $signature = (Get-Content -LiteralPath $pair.SignaturePath -Raw).Trim()
          $tag = "${{ steps.release-meta.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $encodedArtifactName = [uri]::EscapeDataString($pair.ArtifactName)
          $url = "https://github.com/$repo/releases/download/$tag/$encodedArtifactName"
          $metadata = [ordered]@{
            version = "${{ steps.release-meta.outputs.version }}"
            notes = "NSMB Mario vs Luigi Online ${{ steps.release-meta.outputs.version }}"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $url
              }
            }
          }
          $metadata | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $assetDir "latest.json") -Encoding UTF8
      - uses: actions/upload-artifact@v7
        with:
          name: nsmb-mvl-tauri-windows-x86_64
          path: tools/nsmb-mvl-gui/src-tauri/target/release/bundle/**
      - name: Publish GitHub Release
        if: steps.release-meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          name: NSMB MvL GUI ${{ steps.release-meta.outputs.version }}
          files: tools/nsmb-mvl-gui/release-assets/*
          fail_on_unmatched_files: true
