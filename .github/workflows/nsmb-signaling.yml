name: NSMB Signaling

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/nsmb-signaling.yml
      - tools/nsmb-signaling-server/**

jobs:
  ci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/nsmb-signaling-server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Biome
        run: pnpm format-and-lint

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: ci
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/nsmb-signaling-server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy with Alchemy
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEFAULT_ICE_SERVERS: ${{ vars.DEFAULT_ICE_SERVERS }}
          NODE_ENV: production
        run: pnpm run deploy -- --stage prod
