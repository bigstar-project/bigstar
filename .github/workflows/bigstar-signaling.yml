name: Bigstar Signaling

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - .github/workflows/bigstar-signaling.yml
      - tools/bigstar-signaling-server/**
  pull_request:
    branches:
      - main
      - develop
    paths:
      - .github/workflows/bigstar-signaling.yml
      - tools/bigstar-signaling-server/**

jobs:
  ci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/bigstar-signaling-server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Biome
        run: pnpm format-and-lint

  deploy:
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: ci
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        edition:
          - insiders
          - public
    environment: ${{ matrix.edition }}
    defaults:
      run:
        working-directory: tools/bigstar-signaling-server
    env:
      ALCHEMY_STAGE: ${{ github.ref_name == 'develop' && 'develop' || 'prod' }}
      BIGSTAR_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy with Alchemy
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEFAULT_ICE_SERVERS: ${{ vars.DEFAULT_ICE_SERVERS }}
          FEEDBACK_WEBHOOK_URL: ${{ secrets.FEEDBACK_WEBHOOK_URL }}
          NODE_ENV: production
        run: |
          if [ -z "$FEEDBACK_WEBHOOK_URL" ]; then
            echo "FEEDBACK_WEBHOOK_URL secret is required for the $BIGSTAR_EDITION environment" >&2
            exit 1
          fi
          pnpm run deploy --stage "$ALCHEMY_STAGE"
