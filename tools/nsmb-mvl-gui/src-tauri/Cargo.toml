[package]
name = "nsmb-mvl-gui"
version = "0.1.0"
description = "NSMB Mario vs Luigi online launcher"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
anyhow = "1"
nsmb-mvl-rom = { path = "../../nsmb-mvl-rom" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri = { version = "2.9.0", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript", "derive"] }

[lints.rust]
unsafe_code = "forbid"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
